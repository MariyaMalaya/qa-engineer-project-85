  test-data: |
    Тестовые данные
    эл.почта=( не существующего пользователя или с пропуском символов) Пароль = ( не существующий)
  steps:
    - Вводим емайл
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен получить сообщение о том, что "емайл не найден"


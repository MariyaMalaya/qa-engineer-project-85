- summary: |
   Регистрация пользователя в системе
  requirement: |
   При верном вводе псевдонима(nikename), эл.почты(email)и пароля(password) пользователь регистрируется на платформе. Данные уходят на сервер
  prerequisites: |
    Открыта форма для регистрации нового пользователя (см. открытие формы "зарегистрироваться)
  test-data: |
   Псевдоним =(латинские буквы, цифры и подчеркивания. начинаться только с лат.букв) Электронная почта= (состоящая из букв, цифр, спец символа "@"
   и доменного имени) Пароль=(состоять из букв и спец символов, количеством от 6 до 16) дублирование пароля=
  steps:
    - Вводим псевдоним
    - Вводим эл.почту
    - Вводим пароль
    - Вводим дублирующий пароль
    - Нажимаем кнопку «Предоставить»
  expected-result: |
    Пользователь должен попасть на главную страницу, в шапке профиля появляется  аватар и никнейм пользователя

- summary: |
   Регистрация пользователя в системе с некорр. данными (Невозможно пройти регистрацию)
  requirement: |
   При не корректном вводе псевдонима(nickname), эл.почты(email) и пароля(password) пользователь получает сообщения об этом.
  prerequisites: |
   открыта форма для регистрации нового пользователя (см. открытие формы "зарегистрироваться)
  test-data: |
   Псевдоним =(кириллица, без цифр и подчеркиваний. ) Электронная почта= (состоящая  цифр, без спец символа "@"
   и доменного имени) Пароль= (состоять из букв количеством меньше 6 или больше 16, без спец символов) дублирование пароля=
  steps:
    - Вводим не кор. псевдоним
    - Вводим не кор. эл.почту
    - Вводим не кор. пароль
    - Вводим дублирующий пароль
    - Нажимаем кнопку «Предоставить»
  expected-result: |
    Пользователь должен получить сообщение о  вводе не корректных данных, аккаунт не зарегистрирован)
    
- summary: |
   Регистрация пользователя в системе с пустыми полями
  requirement: |
   При не корректном вводе псевдонима(nickname), эл.почты(email) и пароля(password) пользователь получает сообщения об этом.
  prerequisites: |
   Открыта форма для регистрации нового пользователя (см. открытие формы "зарегестрироваться)
  test-data: |
   Псевдоним = пустое окно Электронная почта= пустое окно Пароль= пустое окно дублирование пароля= пустое окно
  steps:
    - Кликаем по полю "псевдоним"
    - Кликаем по полю эл.почту
    - Кликаем по полю  пароль
    - Кликаем по полю пароль
    - Нажимаем кнопку «Предоставить»
  expected-result: |
    Пользователь должен получить сообщение о том, что требуется ввод данных. Регистрация не возможна
    
- summary: |
  Не возможность регистрации пользователя в системе с "пробелом" вместо букв,спец символов и цифр.
  requirement: |
   При не корректном вводе псевдонима, эл.почты и пароля пользователь получает сообщения об этом.
  prerequisites: |
   Открыта форма для регистрации нового пользователя (см. открытие формы "зарегистрироваться)
  test-data: |
   Псевдоним = больше 3 раз нажать пробел. Электронная почта= больше 5 раз нажать пробел Пароль=  дублирование пароля= нажать пробел
  steps:
    - Вводим пробел в поле "псевдоним"
    - Вводим пробел в поле эл.почту
    - Вводим пробел в поле  пароль
    - Вводим пробел в поле пароль
    - Нажимаем кнопку «Предоставить»
  expected-result: |
    Пользователь должен получить сообщение о том, что форма не может содержать пустые символы. 
    

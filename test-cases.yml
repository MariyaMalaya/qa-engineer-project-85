  prerequisites: |
    открыта форма ввода данных для входа
  test-data: |
    Тестовые данные
    эл.почта=( зарегистрированного пользователя ) Пароль = ( от учетной записи зарегистрированного пользователя)
  steps:
    - Вводим емайл
    - Вводим пароль
    - Нажимаем кнопку «Войти»
  expected-result: |
    Пользователь должен попасть на главную страницу
  
- summary: |
   Проверка входа пользователя с НЕ существующими логином и паролем

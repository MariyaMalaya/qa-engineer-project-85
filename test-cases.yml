- summary: |
   открытие формы "Зарегистрироваться" (Sing up)
  requirement: |
   при клике на кнопку зарегестрироваться, происходит переход в форму регистрации пользователя
  prerequisites: |
   открыта главная страница игры
  test-data: |
   кнопка "зарегестрироваться" (Sing up)
  steps:
    - клик на кнопку  "зарегестрироваться" (Sing up)
  expected-result: |
    Пользователь должен попасть в форму регистрации 
    
- summary: |
   Регистрация пользователя в системе
  requirement: |
   При верном вводе псевдонима, эл.почты и пароля пользователь регистрируется на платформе.Данные уходят на сервер
  prerequisites: |
    открыта форма для регистрации нового пользователя (см. открытие формы "зарегистрироваться)
  test-data: |
   Псевдоним =( латинские буквы, цифры и подчеркивания. начинаться только с лат.букв) Электронная почта= (состоящая из букв, цифр, спец символа "@"
   и доменного имени)Пароль=(состоять из букв и спец символов, количеством от 6 до 16) дублирование пароля=
  steps:
    - Вводим псевдоним
    - Вводим эл.почту
    - Вводим пароль
    - Вводим дублирующий пароль
    - Нажимаем кнопку «Предоставить»
  expected-result: |
    Пользователь должен попасть на главную страницу 

- summary: |
   Регистрация пользователя в системе с некорр. данными
  requirement: |
   При не корректном вводе псевдонима, эл.почты и пароля пользователь получает сообщения об этом.
  prerequisites: |
   открыта форма для регистрации нового пользователя (см. открытие формы "зарегестрироваться)
  test-data: |
   Псевдоним =(кириллица, без цифр и подчеркиваний. ) Электронная почта= (состоящая  цифр, без спец символа "@"
   и доменного имени)Пароль=(состоять из букв количеством  меньше 6 или больше 16 ,без спец символов) дублирование пароля=
  steps:
    - Вводим не кор. псевдоним
    - Вводим не кор. эл.почту
    - Вводим не кор. пароль
    - Вводим дублирующий пароль
    - Нажимаем кнопку «Предоставить»
  expected-result: |
    Пользователь должен получить сообщение о  вводе не корректных данных 
    
- summary: |
   Регистрация пользователя в системе с пустыми полями
  requirement: |
   При не корректном вводе псевдонима, эл.почты и пароля пользователь получает сообщения об этом.
  prerequisites: |
   открыта форма для регистрации нового пользователя (см. открытие формы "зарегестрироваться)
  test-data: |
   Псевдоним = пустое окно Электронная почта= пустое окно Пароль= пустое окно дублирование пароля= пустое окно
  steps:
    - Кликаем по полю "псевдоним"
    - Кликаеи по полю эл.почту
    - Кликаем по полю  пароль
    - Кликаем по полю пароль
    - Нажимаем кнопку «Предоставить»
  expected-result: |
    Пользователь должен получить сообщение о том, что требуется ввод данных. Форма не должна отправится на сервр.
    
- summary: |
   Регистрация пользователя в системе с "пробелом" вместо букв,спец символов и цифр.
  requirement: |
   При не корректном вводе псевдонима, эл.почты и пароля пользователь получает сообщения об этом.
  prerequisites: |
   открыта форма для регистрации нового пользователя (см. открытие формы "зарегестрироваться)
  test-data: |
   Псевдоним = больше 3 раз нажать пробел. Электронная почта= больше 5 раз нажать пробел Пароль=  дублирование пароля= нажать пробел
  steps:
    - Вводим пробел в поле "псевдоним"
    - Вводим пробел в поле эл.почту
    - Вводим пробел в поле  пароль
    - Вводим пробел в поле пароль
    - Нажимаем кнопку «Предоставить»
  expected-result: |
    Пользователь должен получить сообщение о том, что форма не может содержать пустые символы. Данные не отправляются на сервер.
    
- summary: |
   Регистрация пользователя с помощью сторонних платформ
  requirement: |
    При верном вводе данных стороннего аккаунта пользователь должен зарегестрироваться в системе
  prerequisites: |
   открыта страница c формой регистрации  ( см.Открытие формы "Зарегистрироваться" (Sing up))
   Кнопка зайти через ...(название стороннего сайта)
  steps:
    - заходим на вводную страницу сайта
    - кликаем по кнопке регистрация"
    - открывается форма регистрации
    - клик по кнопке "войти через ...(название платформы)"
  expected-result: |
    Пользователь должен зарегистрироваться в системе используя данные указанные на строннем сайте.

- summary: |
   Переход из формы регистрации в форму входа, при ошибочном клике на кнопку "Зарегистрироваться"
  requirement: |
   При верной работе кнопки "Войти" в случае наличии учетной записи, форма для ввода меняется для ввода пароля и емайла учетной записи.
  prerequisites: |
   открыта форма для регистрации нового пользователя (см. открытие формы "зарегистрироваться)
  test-data: |
   Кнопка "войти" при наличии учетной записи
  steps:
    - клик на кнопку "войти" в форме регистрации
  expected-result: |
    Пользователь должен попасть на форму с вводом эл.почты и пароля от существующей уч.записи
       

    
